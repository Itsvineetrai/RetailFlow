[project]
name = "aeromart-dataplatform"
version = "1.0.0"
description = "Scalable Retail Data Pipeline for High-Volume Analytics"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Vineet" }
]

dependencies = []

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
warn_return_any = true