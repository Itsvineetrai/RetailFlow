name: aeromart-dataplatform
services:


  # Kafka (KRaft Mode)

  kafka:
    image: apache/kafka:4.1.0
    logging:
    driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    env_file:
        - .env
    container_name: aeromart-kafka
    hostname: kafka

    restart: unless-stopped

    ports:
      - "9092:9092"

# KRaft Configuration
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 12

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - aeromart-network

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

# Kafka Initialization
  kafka-init:
    image: apache/kafka:4.1.0
    container_name: aeromart-kafka-init

    restart: "no"

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "Waiting for Kafka..."
        sleep 10

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic online-sales \
          --partitions 12 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic dead-letter-queue \
          --partitions 6 \
          --replication-factor 1

        echo "Kafka topics created successfully."

    networks:
      - aeromart-network  

  # Spark Master

  spark-master:
    image: bitnami/spark:3.5.5
    logging:
    driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    env_file:
        - .env
    container_name: aeromart-spark-master
    hostname: spark-master

    restart: always

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully  

    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080

    deploy:
        resources:
            limits:
                cpus: "1"
                memory: 1G

    ports:
      - "7077:7077"
      - "8080:8080"

    volumes:
      - ./storage:/workspace/storage
      - ./configs:/workspace/configs
      - ./metadata:/workspace/metadata
      - ./logs:/workspace/logs
      - spark-events:/opt/bitnami/spark/events
      - ./configs/spark:/opt/bitnami/spark/conf

    networks:
      - aeromart-network

  # Spark Worker 1

  spark-worker-1:
    image: bitnami/spark:3.5.5
    logging:
    driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    env_file:
        - .env
    container_name: aeromart-spark-worker-1

    restart: always

    depends_on:
      spark-master:
        condition: service_healthy

    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077

      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2

      SPARK_WORKER_WEBUI_PORT: 8081

    deploy:
        resources:
            limits:
                cpus: "2"
                memory: 2G

    ports:
      - "8081:8081"

    volumes:
      - ./storage:/workspace/storage
      - ./configs:/workspace/configs
      - spark-events:/opt/bitnami/spark/events
      - ./logs:/workspace/logs
      - ./metadata:/workspace/metadata
      - ./configs/spark:/opt/bitnami/spark/conf


    networks:
      - aeromart-network

  # Spark Worker 2

  spark-worker-2:
    image: bitnami/spark:3.5.5
    logging:
    driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    env_file:
        - .env
    container_name: aeromart-spark-worker-2

    restart: always

    depends_on:
      spark-master:
        condition: service_healthy

    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077

      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2

      SPARK_WORKER_WEBUI_PORT: 8082

    deploy:
        resources:
            limits:
                cpus: "2"
                memory: 2G

    ports:
      - "8082:8082"

    volumes:
      - ./storage:/workspace/storage
      - ./configs:/workspace/configs
      - ./logs:/workspace/logs
      - spark-events:/opt/bitnami/spark/events
      - ./metadata:/workspace/metadata
      - ./configs/spark:/opt/bitnami/spark/conf

    networks:
      - aeromart-network

  # MinIO

  minio:
    image: minio/minio:latest
    logging:
    driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    env_file:
        - .env
    container_name: aeromart-minio

    restart: always

    command: >
      server /data 
      --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio-data:/data

    networks:
      - aeromart-network
    
    healthcheck:
      test:
      [
        "CMD",
        "curl",
        "-f",
        "http://localhost:9000/minio/health/live"
    ]

  interval: 30s

  timeout: 10s

  retries: 5

  # MinIO Bucket Initialization

  minio-init:
    image: minio/mc:latest
    container_name: aeromart-minio-init

    depends_on:
      minio:
        condition: service_healthy

    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/raw-pos-files || true;
      mc mb -p local/bronze || true;
      mc mb -p local/silver || true;
      mc mb -p local/gold || true;
      mc mb -p local/dlq || true;
      mc mb -p local/checkpoints || true;
      exit 0;
      "

    networks:
      - aeromart-network

# Networks

networks:
  aeromart-network:
    driver: bridge

# Volumes

volumes:
  kafka-data:
  spark-events:
  minio-data: